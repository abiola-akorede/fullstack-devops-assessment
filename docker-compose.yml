version: '3.9'

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: form-builder-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=form_builder
      - DB_USERNAME=articula
      - DB_PASSWORD=1234567

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: form_builder
      MYSQL_USER: articula
      MYSQL_PASSWORD: 1234567
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - laravel
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
 
volumes:
  db_data:

